<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Voz Ativa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f8;
        }

        header {
            background: #6d28d9;
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .card h2 {
            font-size: 30px;
            color: #6d28d9;
            margin-top: 10px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #6d28d9;
            color: white;
            text-align: left;
            padding: 16px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fafafa;
        }

        button {
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-purple {
            background: #6d28d9;
            color: white;
        }

        .btn-danger {
            background: crimson;
            color: white;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 999px;
            color: white;
            font-size: 12px;
        }

        .pendente { background: #ef4444; }
        .em_analise { background: #f59e0b; }
        .em_atendimento { background: #3b82f6; }
        .resolvida { background: #10b981; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 16px;
            padding: 25px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .linha {
            margin-bottom: 12px;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Voz Ativa - Admin</h1>

            <div>
                <span id="adminNome"></span>
                <button class="btn-danger" onclick="logout()">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <div class="container">

        <div class="cards">
            <div class="card">
                <p>Total de denúncias</p>
                <h2 id="totalDenuncias">0</h2>
            </div>

            <div class="card">
                <p>Pendentes</p>
                <h2 id="pendentes">0</h2>
            </div>

            <div class="card">
                <p>Em análise</p>
                <h2 id="analise">0</h2>
            </div>

            <div class="card">
                <p>Resolvidas</p>
                <h2 id="resolvidas">0</h2>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Tipo</th>
                        <th>Título</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="listaDenuncias"></tbody>
            </table>
        </div>

    </div>

    <!-- modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Detalhes da denúncia</h2>

            <div id="detalhes"></div>

            <select id="novoStatus">
                <option value="pendente">Pendente</option>
                <option value="em_analise">Em análise</option>
                <option value="em_atendimento">Em atendimento</option>
                <option value="resolvida">Resolvida</option>
            </select>

            <br><br>

            <button class="btn-purple" onclick="salvarStatus()">
                Atualizar Status
            </button>

            <button onclick="fecharModal()">
                Fechar
            </button>
        </div>
    </div>

    <script>
        let denunciaSelecionada = null;
        let denuncias = [];

        function protegerPagina() {
            const usuario = JSON.parse(
                localStorage.getItem('usuarioLogado')
            );

            if (!usuario) {
                window.location.href = 'login.html';
                return;
            }


            document.getElementById('adminNome')
                .innerText = usuario.nome;
        }

        async function carregarDenuncias() {
            try {
                const resposta = await fetch(
                    'http://localhost:3000/api/admin/denuncias'
                );

                denuncias = await resposta.json();

                renderizarTabela();
                renderizarCards();

            } catch (erro) {
                console.error(erro);
                alert('Erro ao carregar denúncias');
            }
        }

        function renderizarCards() {

            document.getElementById('totalDenuncias')
                .innerText = denuncias.length;

            document.getElementById('pendentes')
                .innerText = denuncias.filter(
                    d => d.status_denuncia === 'pendente'
                ).length;

            document.getElementById('analise')
                .innerText = denuncias.filter(
                    d => d.status_denuncia === 'em_analise'
                ).length;

            document.getElementById('resolvidas')
                .innerText = denuncias.filter(
                    d => d.status_denuncia === 'resolvida'
                ).length;
        }

        function renderizarTabela() {

            const tbody =
                document.getElementById('listaDenuncias');

            tbody.innerHTML = denuncias.map(d => `
                <tr>
                    <td>${d.id_denuncia}</td>
                    <td>${d.usuario || 'Anônimo'}</td>
                    <td>${d.nome_tipo || '-'}</td>
                    <td>${d.titulo || '-'}</td>

                    <td>
                        <span class="badge ${d.status_denuncia}">
                            ${d.status_denuncia}
                        </span>
                    </td>

                    <td>${d.prioridade}</td>

                    <td>
                        <button
                            class="btn-purple"
                            onclick="abrirModal(${d.id_denuncia})"
                        >
                            Ver
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function abrirModal(id) {

            denunciaSelecionada =
                denuncias.find(d => d.id_denuncia == id);

            document.getElementById('detalhes')
                .innerHTML = `
                <div class="linha">
                    <strong>Usuário:</strong>
                    ${denunciaSelecionada.usuario || 'Anônimo'}
                </div>

                <div class="linha">
                    <strong>Título:</strong>
                    ${denunciaSelecionada.titulo}
                </div>

                <div class="linha">
                    <strong>Descrição:</strong>
                    ${denunciaSelecionada.descricao}
                </div>

                <div class="linha">
                    <strong>Local:</strong>
                    ${denunciaSelecionada.local_ocorrido || '-'}
                </div>

                <div class="linha">
                    <strong>Prioridade:</strong>
                    ${denunciaSelecionada.prioridade}
                </div>
            `;

            document.getElementById('novoStatus')
                .value = denunciaSelecionada.status_denuncia;

            document.getElementById('modal')
                .style.display = 'flex';
        }

        async function salvarStatus() {

            const status =
                document.getElementById('novoStatus')
                .value;

            try {

                await fetch(
                    `http://localhost:3000/api/admin/denuncias/${denunciaSelecionada.id_denuncia}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            status_denuncia: status
                        })
                    }
                );

                alert('Status atualizado');

                fecharModal();
                carregarDenuncias();

            } catch (erro) {
                console.error(erro);
            }
        }

        function fecharModal() {
            document.getElementById('modal')
                .style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }

        protegerPagina();
        carregarDenuncias();
    </script>

</body>

</html>
